name: Deploy Android Remote site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 37 platform
        run: |
          sdkmanager "platforms;android-37"
      - name: Build phone controller APK
        working-directory: ReceiverControlAndroid
        run: |
          chmod +x ./gradlew
          ./gradlew :controller:assembleDebug
      - name: Put current phone APK on the website
        run: cp ReceiverControlAndroid/controller/build/outputs/apk/debug/controller-debug.apk AndroidRemote-Site1-Deploy/ReceiverControl-Controller.apk
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./AndroidRemote-Site1-Deploy
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
